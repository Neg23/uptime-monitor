apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-monitor
  template:
    metadata:
      labels:
        app: uptime-monitor
    spec:
      containers:
        - name: uptime-monitor
          image: ghcr.io/neg23/uptime-monitor:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
