apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-monitor
  template:
    metadata:
      labels:
        app: uptime-monitor
    spec:
      containers:
        - name: uptime-monitor
          image: ghcr.io/neg23/uptime-monitor:latest
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
