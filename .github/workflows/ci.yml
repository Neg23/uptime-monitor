name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Lint Python code
        run: ruff check .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uptime-monitor:test

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 uptime-monitor:test
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8000/metrics
          test "$(docker run --rm uptime-monitor:test id -u)" != "0"

      - name: Show container logs
        if: failure()
        run: docker logs smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/neg23/uptime-monitor:latest
            ghcr.io/neg23/uptime-monitor:${{ github.sha }}
  update-tag:
    needs: build
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[bot] Deploy image')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Set new image tag
        run: sed -i "s/^  tag: .*/  tag: \"${{ github.sha }}\"/" charts/uptime-monitor/values.yaml

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c deploy-${{ github.sha }}
          git commit -am "[bot] Deploy image ${{ github.sha }}"
          git push origin HEAD
          gh pr create --title "[bot] Deploy image ${{ github.sha }}" --body "Update image tag to ${{ github.sha }}"
